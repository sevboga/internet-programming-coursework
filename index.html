<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LaBov Coffee, Pastry & Bakery since 2019.">
    <meta name="author" content="Sava Boga">

    <!--logo on top-->
    <title>LaBov Coffee</title>

    <!--Bootstrap css & cnd-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- retrieve our own js-->
    <script src="js/layout.js" defer></script>

    <!-- retrieve our own css-->
    <link href="css/style.css" rel="stylesheet">

</head>
<body>
    <!--it takes it from layout.js-->
    <header id="site-header"></header>

    <main>
        <!--Banner-->
        <section class="position-relative">
            <img src="img/banner.png" class="img-fluid w-100 d-block" alt="Coffee and pastries at LaBov Coffee">
            <!--dark layer -->
            <div class="banner position-absolute top-0 start-0 w-100 h-100"></div>
            <!--centered-->
            <div class="position-absolute top-50 start-50 translate-middle text-center text-white w-100 px-3">
                <h1 class="display-5 fw-bold">Welcome to <span class="text-gold">LaBov</span> Coffee</h1>
                <p class="lead d-none d-md-block">Coffee, Pastry & Bakery since 2019.</p>
                <a href="menu.html" class="btn btn-menu me-2">Menu</a>
                <a href="contact.html" class="btn btn-outline-light">Visit us</a>
            </div>
        </section>

        <section class="container py-5">
            <p> Write a short intro about LaBov here. </p>
        </section>
    </main>
    <!--it takes it from layout.js-->
    <footer id="site-footer"></footer>

</body>
</html>
